name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm build
        env:
          BACKEND_URL: https://foodnest-server.onrender.com
          API_URL: https://foodnest-server.onrender.com/api/v1
          AUTH_URL: https://foodnest-server.onrender.com/api/auth
          FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: https://foodnest-server.onrender.com/api/v1
          NEXT_PUBLIC_AUTH_URL: http://localhost:3000/api/auth
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
